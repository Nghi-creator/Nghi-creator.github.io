<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#052416" />
    <title>Signal lost | CreatorOS</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #020604; color: #eafff1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { width: min(560px, 100%); border: 1px solid #1f7a4a; border-radius: 8px; background: #06160e; padding: 28px; box-shadow: 0 24px 80px #000; }
      p { color: #b7c9bd; line-height: 1.7; }
      a { display: inline-block; margin-top: 12px; border-radius: 6px; background: #1f7a4a; padding: 12px 16px; color: #052416; font-weight: 900; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <small>CREATOROS / ERROR 404</small>
      <h1>Signal lost.</h1>
      <p>This route is outside the mapped workspace. Return to Nicholas Nguyen's CreatorOS desktop.</p>
      <a href="/">Restore connection</a>
    </main>
    <script>
      var route = location.pathname.replace(/^\/+|\/+$/g, "");
      var appRoutes = ["profile", "resume", "projects", "experience", "education", "certifications", "terminal", "contact"];
      if (appRoutes.indexOf(route) !== -1) location.replace("/?route=" + encodeURIComponent(route));
    </script>
  </body>
</html>
